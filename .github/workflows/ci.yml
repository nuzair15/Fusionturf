name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fusion_league_ci
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret
      MFA_ENCRYPTION_KEY: ci-only-separate-mfa-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fusion_league_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fusion_league_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Apply and verify all database migrations
        working-directory: server
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Verify server
        working-directory: server
        run: npm run typecheck && npm test && npm run build

      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Verify client
        working-directory: client
        run: npm run typecheck && npm test && npm run build

      - name: Audit client dependencies and asset budgets
        run: |
          cd client && npm audit --audit-level=high
          cd .. && node scripts/check-budgets.mjs
