server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router): unknown paths fall through to
    # index.html instead of a raw 404, matching the `/* -> /index.html`
    # rewrite rule already configured for the Render static-site deploy.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
