# gzip compression: the client bundle is JS/CSS/SVG/HTML, all of which
# compress heavily (typically 60-80% smaller over the wire). On a small
# EC2 instance this cuts outbound bandwidth and speeds up page loads
# without costing meaningful CPU -- gzip is cheap relative to the network
# time it saves, and comp_level 5 favors that trade-off over squeezing out
# the last few percent at higher CPU cost.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml
    font/woff2;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router): unknown paths fall through to
    # index.html instead of a raw 404, matching the `/* -> /index.html`
    # rewrite rule already configured for the Render static-site deploy.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html has to be revalidated on every load (it references the
    # current content-hashed bundle) -- caching it would strand users on
    # an old build after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes filenames under /assets/, so a given URL's
    # content never changes -- safe to cache for a year and skip
    # revalidation requests entirely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static files (favicon, manifest, images in /public) aren't
    # content-hashed, so cache them more conservatively.
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
