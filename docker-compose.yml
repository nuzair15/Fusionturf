version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fusion_league
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fusion_league
      JWT_SECRET: development-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - postgres
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      # Vite bakes VITE_* vars into the built JS bundle at build time, so
      # this has to be a build arg, not `environment:` below — a runtime
      # env var has no effect on an already-built static bundle.
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
