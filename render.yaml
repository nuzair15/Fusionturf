services:
  - type: web
    name: fusion-league-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd server && node dist/production.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fusion-league-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://fusion-league-client.onrender.com,https://www.fusionturf.in,https://fusionturf.in
      - key: FRONTEND_URL
        value: https://fusion-league-client.onrender.com
      - key: PORT
        value: "10000"

  - type: web
    name: fusion-league-client
    env: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://fusion-league-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: fusion-league-db
    region: oregon
    plan: free
    databaseName: fusion_league
    ipAllowList: []
